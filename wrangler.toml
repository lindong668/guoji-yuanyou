# ===================================================================
# ★★ 版本号：A27 —— 2026-10-30 基线（当前线上生效版）
# -------------------------------------------------------------------
# 版本序列：… A22o → A22p → A26 → 【A27】
#
# A27 本轮（10-30）改动清单：
#   ① liveOverlay 不再返回 null —— 修「全部连接中断」根因
#   ② 接口预算与页面预算分离（页面 2.5s / 接口 8s）
#   ③ 原油补 3 号兜底（自有源全挂时回落）
#   ④ robots 屏蔽 /api/、/probe、/diag（9 个爬虫组全覆盖）
#   ⑤ 布伦特跨源合流补齐 + 缺口沿用旧值加 2 分钟时效（治锁死）
#   ⑥ 原油取数重做：串行 → 并发补缺口
#   ⑦ ★ 布伦特改取最后一根 1 分钟 K 线 close（治「不爱动」）
#      新增 Yahoo spark 源；快批移出 stooq / biquote / oilwatch
#
# 下一版请从 A28 起。
# ===================================================================
name = 'guoji-yuanyou'
account_id = 'd49e51b1279804c22035a33a9c1cb06e'
main = "src/index.js"
compatibility_date = "2025-04-01"   # ★ A16：assets 需要较新的兼容日期

# ===================================================================
# ★ 本次更新（由 Netlify 测试版 O 版回迁）
# -------------------------------------------------------------------
# 业务代码 src/ 与 Netlify 测试站【完全一致】，零改动复制。
# 新增两个文件：src/oilLive.js（原油 8 源）、src/goldLive.js（黄金 7 源）。
#
# 回迁无需改任何业务代码的原因：
#   代码是零依赖纯 Web API（fetch / Request / Response / AbortController），
#   CF 与 Netlify 都原生支持。唯一区别是入口形态 —— 而 src/index.js
#   本来就是 Worker 格式（export default { fetch }），所以直接当入口即可。
#
# ★ 关于 3 号密钥 SITE3_KEY（重要，部署后必看）：
#   代码里的内置密钥【已清空】，密钥改由平台侧加密 Secret 注入。
#   ⚠️ 必须在本项目 → 设置 → 变量和机密 里添加（类型选「密钥/Secret」）：
#        名称 = SITE3_KEY
#        值   = <你的 3 号访问密钥>
#      否则国内油价模块会显示「0 个地区」（抓不到 3 号）。
#   注：下面 [vars] 里【故意不写】SITE3_KEY —— 明文空值会顶掉加密 Secret，
#       导致"配了值却依然取不到数"。所以它只走 Secret，不进 Git。
# ===================================================================

# ---- Custom domain: must use /* so ALL paths reach the Worker ----
routes = [
  { pattern = "you.piccalc.com/*", zone_name = "piccalc.com" }
]
# workers_dev = true

# ===================================================================
# ★★ 共享缓存 KV —— 彻底解决"来回导航跳价"
# -------------------------------------------------------------------
# 现象：点布伦特进去→退出来→点WTI进去→退出来，价格会跳，
#       且【不是刷新时刻】也跳。
#
# 根因：模块级缓存是【每个 Worker 实例各自一份】。CF 并行跑多个实例，
#       这次请求打到 A、下次打到 B，两份缓存各自刷新 → 拿到不同值。
#
# 修法：缓存写进 KV，所有实例共享同一份。
#   代码已做【优雅降级】：没绑定 KV 时自动退回模块级缓存，不会报错。
#
# ★ 启用只需两步（不做也能正常跑，只是跨实例仍可能跳）：
#   ① npx wrangler kv:namespace create PRICESCOPE_CACHE
#   ② 把返回的 id 填到下面 id = "..." 处，然后重新部署
# ===================================================================
# ===================================================================
# ★★ KV 共享缓存 —— 【已否决，保持注释，不要启用】
# -------------------------------------------------------------------
# 否决理由（用户拍板）：要让写入次数落进免费额度（1,000/天），
#   就必须把刷新周期从 15 秒放宽到 3 分钟 —— 等于把实时行情变成
#   3 分钟前的旧值。为了消灭"两个页面差 0.02"而牺牲数据的新鲜度，不划算。
#   两个页面差 0.02 本来就是市场在这 1 秒里真的动了，不是错误。
#
# 替代方案（已实现）：前端价格锚定（sessionStorage），见 src/pages.js。
#   零服务端写入、零额度消耗，且专门治"用户来回导航"这个真实场景。
#
# 真要启用：① npx wrangler kv:namespace create PRICESCOPE_CACHE
#           ② 取消下面三行注释并填 id
#           ③ 同步把 src/index.js 的 KV_SHARE_TTL 调大（否则写入必爆额度）
# ===================================================================
# [[kv_namespaces]]
# binding = "PRICESCOPE_CACHE"
# id = "把这里换成真实 id"

# ===================================================================
# ★★ KV【休市状态标记】—— 用途与上一段完全不同，这一段要启用
# -------------------------------------------------------------------
# 上面否决的是「共享实时缓存」：15 秒写一次 = 5760 次/天，必爆额度。
# 这里存的是「休市状态」：低频翻转的标记，只在【价格变了】或【状态翻转】
# 时才写；休市期间价格不动，一次都不写。实测开市约 144 次/天，周末近 0。
#
# 解决的问题：周末用户打开页面，不必自己从零等满 15 分钟才显示休市中 ——
#   服务端 Cron 每 10 分钟独立判定并记下，任何人任何时刻打开都立刻显示。
#
# 复用 3 号已有的 namespace（无需新建），key 统一加 ps2_ 前缀，不冲突。
# ===================================================================
[[kv_namespaces]]
binding = "MKT_STATE_KV"
id = "af76a1d05d444244a468ed02d6617f98"

# ---- 服务端独立判定休市（每 10 分钟，不依赖用户是否打开页面）----
[triggers]
crons = ["*/10 * * * *"]

# ---- Fill AFTER AdSense approval / Search Console verification ----
# Leave blank for now; the site shows placeholders instead of real ads.
# ---- A16：静态资源目录（图标改为真文件，不再 base64 内嵌 JS）----
# 匹配规则：先找 public/ 下的真文件，找不到才走 Worker。
# public/ 只放图标，页面/robots/sitemap/ads.txt 仍由 Worker 生成，不冲突。
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
ADSENSE_CLIENT = ""   # ca-pub-1234567890123456
AD_SLOT_HOME   = ""
AD_SLOT_OIL    = ""
AD_SLOT_GOLD   = ""
AD_SLOT_CN     = ""
AD_SLOT_FX     = ""
AD_SLOT_WTI    = ""
AD_SLOT_BLOG   = ""
AD_SLOT_ARTICLE= ""
AD_SLOT_LEGAL  = ""
GA4_ID         = ""   # G-ABCDEF1234
GSC_VERIFY     = ""   # google-site-verification=...
# SITE3_KEY 不在此处配置：它是加密 Secret，在 CF 后台「变量和机密」里添加。
# 写在这里（哪怕是空串）都会顶掉加密值，导致国内油价抓不到。

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true      # ★ 记录每次调用，缺了它看不到访问者
head_sampling_rate = 1      # 100% 采样，不漏

# ---- A17：修复 Workers Builds 预览部署失败 ----
# 现象：GitHub Actions 上 "Workers Builds: guoji-yuanyou" 报红叉，
#       但生产部署（wrangler deploy）其实成功、站点正常。
# 根因：CF 的预览构建跑的是 `npx wrangler preview`，
#       该命令要求配置里存在 [previews.vars] 块，缺失即报：
#       "Your Wrangler configuration is missing a `previews` block"
# 修法：把与 [vars] 一一对应的变量写入预览块（同样留空占位）。
# 已用脚本比对：两处变量名、数量完全一致（12/12，SITE3_KEY 走 Secret 不在此列）。
[previews.vars]
ADSENSE_CLIENT = ""
AD_SLOT_HOME   = ""
AD_SLOT_OIL    = ""
AD_SLOT_GOLD   = ""
AD_SLOT_CN     = ""
AD_SLOT_FX     = ""
AD_SLOT_WTI    = ""
AD_SLOT_BLOG   = ""
AD_SLOT_ARTICLE= ""
AD_SLOT_LEGAL  = ""
GA4_ID         = ""
GSC_VERIFY     = ""

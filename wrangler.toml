name = 'guoji-yuanyou'
main = "src/index.js"
compatibility_date = "2024-12-01"

# ---- Custom domain: must use /* so ALL paths reach the Worker ----
routes = [
  { pattern = "you.piccalc.com/*", zone_name = "piccalc.com" }
]
# workers_dev = true

# Uncomment and fill after `wrangler kv:namespace create PRICESCOPE_CACHE`
# if you later want persistent caching:
# [[kv_namespaces]]
# binding = "PRICESCOPE_CACHE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# ---- Fill AFTER AdSense approval / Search Console verification ----
# Leave blank for now; the site shows placeholders instead of real ads.
[vars]
ADSENSE_CLIENT = ""   # ca-pub-1234567890123456
AD_SLOT_HOME   = ""
AD_SLOT_OIL    = ""
AD_SLOT_GOLD   = ""
AD_SLOT_CN     = ""
AD_SLOT_FX     = ""
AD_SLOT_WTI    = ""
AD_SLOT_BLOG   = ""
AD_SLOT_ARTICLE= ""
AD_SLOT_LEGAL  = ""
GA4_ID         = ""   # G-ABCDEF1234
GSC_VERIFY     = ""   # google-site-verification=...

[observability]
enabled = true
